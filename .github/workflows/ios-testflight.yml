# develop ブランチへ push されるたびに iOS アプリをビルドし、TestFlight（App Store Connect）へアップロードする。
#
# 必要な Repository secrets（Settings → Secrets and variables → Actions）:
#   API_URL                 アプリが接続する公開サーバーの URL
#   REVENUECAT_IOS_KEY      RevenueCat の iOS 公開キー（appl_…）
#   LINE_CHANNEL_ID         LINE ログインチャネルの ID（LINE アプリ直接ログイン用。任意）
#   IOS_TEAM_ID             Apple Developer の Team ID（10桁）
#   IOS_DIST_CERT_P12       Apple Distribution 証明書（.p12、秘密鍵入り）を base64 にした文字列
#   IOS_DIST_CERT_PASSWORD  .p12 のパスワード
#   IOS_PROVISIONING_PROFILE App Store Connect 配布用プロビジョニングプロファイル（.mobileprovision）を base64 にした文字列
#   ASC_KEY_ID              App Store Connect API キーの Key ID
#   ASC_ISSUER_ID           App Store Connect API キーの Issuer ID
#   ASC_API_KEY_P8          App Store Connect API キーの .p8 ファイルの中身
#
# ビルド番号は scripts/ios-upload.sh が現在日時（例: 202609211230）から付けるので、毎回前回より大きくなる。
name: iOS TestFlight

on:
  push:
    branches: [develop]
    paths-ignore:
      - "android/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "表示バージョン（例: 1.1）。空なら Xcode プロジェクトの値を使う"
        required: false
        type: string

# 同時に 2 本走るとビルド番号（分単位）が衝突しうるので、1 本ずつ順番に実行する
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    # App Store Connect は iOS 26 SDK（Xcode 26 以降）でビルドしたアプリしか受け付けない。
    # macos-26 イメージは最新の Xcode 26.x が既定。
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets and sync to iOS
        env:
          API_URL: ${{ secrets.API_URL }}
          REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
        run: |
          npm run mobile:build
          npx cap sync ios

      - name: Install signing certificate into a temporary keychain
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/ios-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="$RUNNER_TEMP/distribution.p12"
          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Apple の中間証明書（証明書チェーンの検証に必要。ランナーに無い場合に備えて入れておく）
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            && security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -A || echo "WWDR 中間証明書の取り込みをスキップしました"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$CERT"

          echo "取り込んだ署名用証明書:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::IOS_DIST_CERT_P12 に Apple Distribution 証明書が入っていません（Apple Development では TestFlight にアップロードできません）。Keychain Access で「Apple Distribution: …」を秘密鍵ごと .p12 に書き出し、Secret を登録し直してください。"
            exit 1
          fi
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -eu
          if [ -z "$IOS_PROVISIONING_PROFILE_B64" ]; then
            echo "::error::Secret IOS_PROVISIONING_PROFILE がありません。developer.apple.com → Profiles で App Store Connect 配布用プロファイルを作り、.mobileprovision を base64 にして登録してください。"
            exit 1
          fi
          PROFILE="$RUNNER_TEMP/AppStore.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_B64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" | plutil -extract Name raw -o - - | sed 's/^/プロファイル: /'
          echo "IOS_PROVISIONING_PROFILE=$PROFILE" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -eu
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive and upload to TestFlight
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: npm run ios:upload

      - name: Remove temporary keychain and API key
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "${ASC_API_KEY_PATH:-}" "${IOS_PROVISIONING_PROFILE:-}" "$RUNNER_TEMP/distribution.p12"
