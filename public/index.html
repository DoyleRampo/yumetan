<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#121125" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ユメタン / Yumetan</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css?v=4.8.2" />
    <link rel="stylesheet" href="loading.css?v=4.8.0" />
    <link rel="stylesheet" href="interface.css?v=4.8.0" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <header id="header"></header>
    <main id="app" tabindex="-1">
      <div class="launch-loading">
        <span class="dream-loading" role="status"
          ><span class="dream-loading__scene" aria-hidden="true"
            ><span class="dream-loading__orbit"></span
            ><span class="dream-loading__moon"></span
            ><span class="dream-loading__star dream-loading__star--one">✦</span
            ><span class="dream-loading__star dream-loading__star--two">✧</span
            ><span class="dream-loading__star dream-loading__star--three"
              >✦</span
            ></span
          ><span class="dream-loading__copy">ユメタンへようこそ</span
          ><span class="dream-loading__hint"
            >夢の世界へ、ようこそ</span
          ></span
        >
      </div>
    </main>
    <nav id="nav"></nav>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="config.js?v=4.8.0"></script>
    <script src="firebase-config.js?v=4.8.0"></script>
    <script type="module" src="cloud.js?v=4.8.0"></script>
    <script type="module" src="app.js?v=4.8.0"></script>
  </body>
</html>
