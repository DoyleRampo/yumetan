# Render Blueprint. Billing stays disabled until the RevenueCat values are configured.
services:
  - type: web
    name: yumetan
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_GLOBAL_MONTHLY_USD
        value: "20"
      - key: FIREBASE_PROJECT_ID
        value: yumetan-a31f0
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REVENUECAT_SECRET_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_AUTH
        sync: false
      - key: SUPPORT_URL
        sync: false
