<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ユメタン">
<meta name="description" content="起きてすぐ、夢を話すだけ。聞いて、覚えて、心の状態を教えてくれるAI">
<title>ユメタン — 夢を聞いてくれるAI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=3.1.0">
</head>
<body>
<!-- キャラクター用のグラデーション定義（非表示画面の複製から参照できるよう1か所にまとめる） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dcc8"/><stop offset="0.6" stop-color="#f0cdb3"/><stop offset="1" stop-color="#e2b394"/></linearGradient>
    <linearGradient id="skinShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a98c"/><stop offset="1" stop-color="#e8bfa4"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3760"/><stop offset="1" stop-color="#1a2240"/></linearGradient>
    <linearGradient id="lapel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202a4d"/><stop offset="1" stop-color="#141b33"/></linearGradient>
    <linearGradient id="hairW" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a3226"/><stop offset="0.5" stop-color="#2f1f17"/><stop offset="1" stop-color="#1f150f"/></linearGradient>
    <linearGradient id="hairM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2b22"/><stop offset="0.5" stop-color="#241a14"/><stop offset="1" stop-color="#15100c"/></linearGradient>
    <radialGradient id="iris" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#8a5a3c"/><stop offset="0.7" stop-color="#4b2e1e"/><stop offset="1" stop-color="#2a1810"/></radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#f2b56b" stop-opacity="0.22"/><stop offset="1" stop-color="#f2b56b" stop-opacity="0"/></radialGradient>
  </defs></svg>
<header class="top">
  <button id="back" class="back" hidden aria-label="戻る"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>戻る</span></button>
  <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>ユメタン</span></h1>
</header>

<main>
  <!-- ホーム = 日記帳（書く・話す・読み取る・記憶する） -->
  <section id="view-home" class="view active">
    <div class="journal-head">
      <div class="date" id="today"></div>
      <h2 class="headline" id="headline">今日の夢を<br>ひとこと。</h2>
    </div>

    <div id="chat" class="chat" aria-live="polite"></div>

    <div id="transcript-wrap" class="transcript-wrap">
      <textarea id="transcript" class="paper" rows="4" placeholder="覚えている範囲で。断片でも、順番がばらばらでも大丈夫"></textarea>
      <p id="status" class="status"></p>
      <div class="journal-actions">
        <button id="mic" class="btn outline" aria-label="話す"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>話す</span></button>
        <button id="send" class="btn primary">読み取る</button>
      </div>
      <button id="clear" class="btn ghost small-link" hidden>消す</button>
    </div>

    <div id="after" class="after" hidden>
      <button id="save-dream" class="btn primary big save">この夢を記憶する</button>
      <p class="muted center small-note" id="ask-note">気になることがあれば、ユメタンに聞けます</p>
      <div class="ask-row" id="ask-text">
        <input id="ask-input" class="input" placeholder="例: どうすればいい？ / なんでこの夢？" autocomplete="off" enterkeyhint="send">
        <button id="ask-mic" class="btn outline icon-only" aria-label="声で質問"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button id="ask-send" class="btn">聞く</button>
      </div>
      <p class="muted center small-note" id="ask-status" hidden></p>
      <button id="new-dream" class="btn ghost small-link">新しい夢を書く</button>
    </div>

    <div class="journal-links">
      <button class="link-btn" data-mode="interview">言葉にしにくいときは、質問に答えて記録<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <div class="home-chara"></div>

    <nav class="journal-nav">
      <button data-go="history"><span>夢の記録</span><span class="count" id="home-count" hidden></span></button>
      <button data-go="insight"><span>心の状態</span></button>
      <button data-go="settings"><span>設定</span></button>
    </nav>
  </section>

  <!-- 質問形式 -->
  <section id="view-interview" class="view">
    <div class="chara-slot"></div>
    <div id="iv-progress" class="progress" aria-label="進み具合"></div>
    <div id="iv-answers" class="answers">
      <button class="btn answer yes" data-answer="はい">はい</button>
      <button class="btn answer no" data-answer="いいえ">いいえ</button>
      <button class="btn answer skip" data-answer="スキップ">スキップ</button>
      <button class="btn answer other" data-answer="__other">その他…</button>
    </div>
    <div id="iv-other" class="transcript-wrap" hidden>
      <textarea id="iv-other-text" rows="2" placeholder="例: 追いかけてきたのは学校の先生だった"></textarea>
      <div class="row">
        <button id="iv-other-send" class="btn primary">これで答える</button>
        <button id="iv-other-cancel" class="btn ghost">やめる</button>
      </div>
    </div>
    <div id="iv-confirm" class="transcript-wrap" hidden>
      <p class="muted">まとめるとこんな夢でしたか？ 直してもOK。読み取ったあとで記憶できます</p>
      <textarea id="iv-dream-text" rows="5"></textarea>
      <div class="row">
        <button id="iv-save" class="btn primary big">この夢を読み取る</button>
        <button id="iv-more" class="btn ghost">もう少し質問して</button>
      </div>
    </div>
    <div class="row small">
      <button id="iv-finish" class="btn ghost">もう十分、まとめて</button>
      <button id="iv-restart" class="btn ghost">最初から</button>
    </div>
    <div id="iv-log" class="iv-log"></div>
  </section>

  <!-- 記録一覧 -->
  <section id="view-history" class="view">
    <h2>夢の記録</h2>
    <div id="history" class="history"></div>
  </section>

  <!-- 心の状態 -->
  <section id="view-insight" class="view">
    <h2>最近の心の状態</h2>
    <div id="insight" class="insight"></div>
    <div class="row small">
      <button id="insight-refresh" class="btn ghost">もう一度分析する</button>
    </div>
  </section>

  <!-- ログイン / 新規登録 -->
  <section id="view-login" class="view">
    <h2>ログイン / 新規登録</h2>
    <p class="muted">メールアドレスで登録すると、機種変更や別の端末でも同じ記録が使えます。今この端末にある記録はそのまま引き継がれます。</p>
    <form id="login-form" class="form" autocomplete="on">
      <label class="field"><span>メールアドレス</span><input type="email" id="login-email" class="input" placeholder="you@example.com" autocomplete="email" required></label>
      <label class="field"><span>パスワード（6文字以上）</span><input type="password" id="login-pass" class="input" placeholder="••••••••" autocomplete="current-password" minlength="6" required></label>
      <p class="muted" id="login-msg" hidden></p>
      <div class="row">
        <button type="submit" class="btn primary big" id="login-submit" data-action="signin">ログイン</button>
      </div>
      <div class="row small">
        <button type="button" class="btn ghost" id="login-signup">新規登録はこちら</button>
        <button type="button" class="btn ghost" id="login-reset">パスワードを忘れた</button>
      </div>
    </form>
  </section>

  <!-- 設定 -->
  <section id="view-settings" class="view">
    <h2>設定</h2>
    <div class="setting">
      <span>キャラクター</span>
      <div class="seg">
        <button class="seg-btn" data-chara="woman">女性</button>
        <button class="seg-btn" data-chara="man">男性</button>
      </div>
    </div>
    <label class="setting"><input type="checkbox" id="opt-speak"> 質問形式の質問文を声で読み上げる</label>
    <label class="setting"><input type="checkbox" id="opt-autosend"> 話し終わったら自動で読み取る</label>
    <div class="setting col" id="code-setting" hidden>
      <span>合言葉（配布元から受け取ったもの）</span>
      <input type="text" id="opt-code" class="input" placeholder="合言葉" autocomplete="off">
    </div>

    <h3>アカウント</h3>
    <div id="account-box" class="account">
      <p class="muted" id="account-info">読み込み中…</p>
      <div class="row left" id="account-actions"></div>
    </div>

    <h3>データ</h3>
    <p class="muted" id="sync-info">夢の記録はこの端末（アプリ）の中だけに保存されます。機種変更や別のブラウザに移すときは書き出してください。</p>
    <div class="row left">
      <button id="export" class="btn">書き出す</button>
      <button id="import-toggle" class="btn">読み込む</button>
      <button id="wipe" class="btn danger">全部消す</button>
    </div>
    <div id="io-wrap" class="transcript-wrap" hidden>
      <textarea id="io-text" rows="5" placeholder="ここに書き出したデータを貼り付けて「読み込み実行」"></textarea>
      <div class="row">
        <button id="io-copy" class="btn">コピー</button>
        <button id="io-import" class="btn primary">読み込み実行</button>
      </div>
    </div>

    <details class="adv">
      <summary>詳細設定</summary>
      <label class="setting"><input type="checkbox" id="opt-ai"> AI（Claude）で分析する（サーバーにAPIキーと残高が必要）</label>
      <div class="setting col">
        <span>サーバーURL（空なら標準）</span>
        <input type="url" id="opt-api" class="input" placeholder="https://example.onrender.com" autocomplete="off">
      </div>
      <p class="muted" id="sr-support"></p>
      <p class="muted" id="app-info"></p>
    </details>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="firebase-config.js?v=3.1.0"></script>
<script type="module" src="cloud.js?v=3.1.0"></script>
<script src="engine/lexicon.js?v=3.1.0"></script>
<script src="engine/analyze.js?v=3.1.0"></script>
<script src="engine/insight.js?v=3.1.0"></script>
<script src="engine/interview.js?v=3.1.0"></script>
<script src="app.js?v=3.1.0"></script>
<script>
  if ("serviceWorker" in navigator && !window.Capacitor?.isNativePlatform?.()) {
    navigator.serviceWorker.register("sw.js").then((reg) => reg.update().catch(() => {})).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
  }
</script>
</body>
</html>
