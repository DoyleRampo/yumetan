# Render Blueprint. Configure test keys first; billing stays disabled until configured.
services:
  - type: web
    name: yumetan
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_GLOBAL_MONTHLY_USD
        value: "20"
      - key: FIREBASE_PROJECT_ID
        value: yumetan-a31f0
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STARTER_YEARLY
        sync: false
      - key: STRIPE_PRICE_STANDARD_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STANDARD_YEARLY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://yumetan.onrender.com
      - key: SUPPORT_URL
        sync: false
